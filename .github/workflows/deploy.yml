name: Build + Deploy Next.js site to Pages (release only)

on:
  push:
    branches: ['release', 'dev']
  pull_request:
    branches: ['release', 'dev']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: quality-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
        

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      # Only needed for an actual Pages deployment build
      - name: Setup Pages
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/release' }}
        uses: actions/configure-pages@v4

      - name: Build with Next.js on Bun
        run: bun run build

      # Only upload the special Pages artifact when we intend to deploy
      - name: Upload Pages artifact (release pushes only)
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/release' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: './out'

  deploy:

    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/release' }}

    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write


    concurrency:
      group: 'pages-release'
      cancel-in-progress: true

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
